services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: rag_local
      POSTGRES_USER: rag_local
      POSTGRES_PASSWORD: local-chat-only
    volumes:
      - ./local-chat-data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_local -d rag_local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: rag_local
      POSTGRES_USER: rag_local
      POSTGRES_PASSWORD: local-chat-only
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OPENAI_API_KEY: ""
      LLAMACPP_API_KEY: local-chat-dev-token
      RAG_SETTINGS_PATH: /config/runtime-settings.json
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./app:/app/app
      - ./local-chat-data:/data
      - ./local-chat-config:/config

  local-web:
    image: nginx:1.29-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./config/local-chat-nginx.conf:/etc/nginx/conf.d/default.conf:ro
