name: Pull Request Build & Lint

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Detect changed components
        id: changes
        uses: ./.github/actions/detect-rag-components

      - name: Run lint
        run: make lint

      - name: Run full test suite
        if: steps.changes.outputs.common == 'true' || steps.changes.outputs.release == 'true' || steps.changes.outputs.test_support == 'true'
        run: make test

      - name: Run tests for changed components
        if: steps.changes.outputs.common != 'true' && steps.changes.outputs.release != 'true' && steps.changes.outputs.test_support != 'true' && (steps.changes.outputs.api == 'true' || steps.changes.outputs.embed == 'true' || steps.changes.outputs.normalize == 'true')
        env:
          API_CHANGED: ${{ steps.changes.outputs.api }}
          EMBED_CHANGED: ${{ steps.changes.outputs.embed }}
          NORMALIZE_CHANGED: ${{ steps.changes.outputs.normalize }}
        run: |
          components=()
          if [[ "$API_CHANGED" == "true" ]]; then components+=(api); fi
          if [[ "$EMBED_CHANGED" == "true" ]]; then components+=(embed); fi
          if [[ "$NORMALIZE_CHANGED" == "true" ]]; then components+=(normalize); fi
          make test-components COMPONENTS="${components[*]}"

      - name: Skip tests for non-runtime changes
        if: steps.changes.outputs.common != 'true' && steps.changes.outputs.release != 'true' && steps.changes.outputs.test_support != 'true' && steps.changes.outputs.api != 'true' && steps.changes.outputs.embed != 'true' && steps.changes.outputs.normalize != 'true'
        run: echo "No runtime or test-support files changed; component tests are not needed."

      - name: Validate affected Docker builds
        uses: ./.github/actions/build-rag-images
        with:
          push: false
          tag: pr-${{ github.event.number }}
          build-api: ${{ steps.changes.outputs.common == 'true' || steps.changes.outputs.api == 'true' }}
          build-embed: ${{ steps.changes.outputs.common == 'true' || steps.changes.outputs.embed == 'true' }}
          build-normalize: ${{ steps.changes.outputs.common == 'true' || steps.changes.outputs.normalize == 'true' }}
