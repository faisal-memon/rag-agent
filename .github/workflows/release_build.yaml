name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Detect changed components
        id: changes
        uses: ./.github/actions/detect-rag-components

      - name: Run lint
        run: make lint

      - name: Run full test suite
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.common == 'true' || steps.changes.outputs.release == 'true' || steps.changes.outputs.test_support == 'true'
        run: make test

      - name: Run tests for changed components
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.common != 'true' && steps.changes.outputs.release != 'true' && steps.changes.outputs.test_support != 'true' && (steps.changes.outputs.api == 'true' || steps.changes.outputs.embed == 'true' || steps.changes.outputs.normalize == 'true')
        env:
          API_CHANGED: ${{ steps.changes.outputs.api }}
          EMBED_CHANGED: ${{ steps.changes.outputs.embed }}
          NORMALIZE_CHANGED: ${{ steps.changes.outputs.normalize }}
        run: |
          components=()
          if [[ "$API_CHANGED" == "true" ]]; then components+=(api); fi
          if [[ "$EMBED_CHANGED" == "true" ]]; then components+=(embed); fi
          if [[ "$NORMALIZE_CHANGED" == "true" ]]; then components+=(normalize); fi
          make test-components COMPONENTS="${components[*]}"

      - name: Skip tests for non-runtime changes
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.common != 'true' && steps.changes.outputs.release != 'true' && steps.changes.outputs.test_support != 'true' && steps.changes.outputs.api != 'true' && steps.changes.outputs.embed != 'true' && steps.changes.outputs.normalize != 'true'
        run: echo "No runtime or test-support files changed; component tests are not needed."

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Release API image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || steps.changes.outputs.api == 'true'
        uses: ./.github/actions/release-rag-image
        with:
          tag-prefix: api-v
          target: api
          image: api
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          github-token: ${{ github.token }}

      - name: Release embed image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || steps.changes.outputs.embed == 'true'
        uses: ./.github/actions/release-rag-image
        with:
          tag-prefix: embed-v
          target: embed
          image: embed
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          github-token: ${{ github.token }}

      - name: Release normalize image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release == 'true' || steps.changes.outputs.common == 'true' || steps.changes.outputs.normalize == 'true'
        uses: ./.github/actions/release-rag-image
        with:
          tag-prefix: normalize-v
          target: normalize
          image: normalize
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          github-token: ${{ github.token }}
