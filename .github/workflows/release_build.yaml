name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Build application
        run: make build

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed components
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Dockerfile'
              - 'app/core/**'
            api:
              - 'requirements-api.txt'
              - 'app/agent/**'
            embed:
              - 'requirements-embed.txt'
              - 'app/embed/**'
            normalize:
              - 'requirements-normalize.txt'
              - 'app/normalize/**'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Release API image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.common == 'true' || steps.changes.outputs.api == 'true'
        uses: ./.github/actions/release-rag-image
        with:
          tag-prefix: api-v
          target: api
          image: api
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          github-token: ${{ github.token }}

      - name: Release embed image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.common == 'true' || steps.changes.outputs.embed == 'true'
        uses: ./.github/actions/release-rag-image
        with:
          tag-prefix: embed-v
          target: embed
          image: embed
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          github-token: ${{ github.token }}

      - name: Release normalize image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.common == 'true' || steps.changes.outputs.normalize == 'true'
        uses: ./.github/actions/release-rag-image
        with:
          tag-prefix: normalize-v
          target: normalize
          image: normalize
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          github-token: ${{ github.token }}
