<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Personal RAG</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="__BODY_CLASS__">
    <main>
      <aside class="conversation-sidebar" id="conversation-sidebar" aria-label="Navigation and conversations">
        <div class="conversation-sidebar-header"><strong>Personal AI</strong><button class="secondary icon-button" id="toggle-conversations" type="button" aria-label="Close navigation menu" title="Close menu"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button></div>
        <nav class="conversation-drawer-nav" id="conversation-drawer-nav" aria-label="Application">
          <a class="agent-nav" href="/">Chat</a>
          <a class="debug-nav" href="/debug">Debug</a>
          <a class="settings-nav" href="/settings">Settings</a>
          <a href="/docs">API</a>
        </nav>
        <button id="new-conversation" type="button">New conversation</button>
        <div id="conversation-list" class="conversation-list"></div>
        <button class="secondary" id="show-all-conversations" type="button" hidden>See all conversations</button>
      </aside>
      <header class="app-header" aria-label="Application header">
        <button class="secondary mobile-menu-toggle" id="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="conversation-sidebar" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <span class="app-header-brand">Personal AI</span>
        <button class="secondary account-placeholder" type="button" aria-label="Account, coming soon" title="Account, coming soon" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" /><path d="M5 20a7 7 0 0 1 14 0" /></svg>
        </button>
      </header>
      <section class="hero">
        <div class="hero-topline">
          <div class="eyebrow">Personal AI</div>
        </div>
        <h1>__PAGE_HEADING__</h1>
        <p class="subtitle">__PAGE_SUBTITLE__</p>
        <nav class="page-nav" id="page-nav" aria-label="Application">
          <button class="secondary" id="show-conversations" data-close-mobile-menu type="button">Conversations</button>
          <a class="agent-nav" href="/">Chat</a>
          <a class="debug-nav" href="/debug">Debug</a>
          <a class="settings-nav" href="/settings">Settings</a>
          <a href="/docs">API</a>
        </nav>
      </section>

      <section class="query-card">
        <label for="question">__INPUT_LABEL__</label>
        <textarea id="question" placeholder="__INPUT_PLACEHOLDER__"></textarea>
        <div class="actions">
          <div class="mode-picker" aria-label="Retrieval mode">
            <input type="radio" id="mode-semantic" name="retrieval-mode" value="semantic" checked />
            <label for="mode-semantic">Semantic</label>
            <input type="radio" id="mode-keyword" name="retrieval-mode" value="keyword" />
            <label for="mode-keyword">Keyword</label>
          </div>
          <button id="ask">Ask</button>
          <button class="secondary icon-button" id="agent" type="button" aria-label="Send message" title="Send message">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
          <button class="secondary icon-button" id="record" type="button" aria-label="Record message" title="Record message">
            <svg class="record-mic-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm6-3a6 6 0 0 1-12 0M12 17v4M8 21h8" /></svg>
            <svg class="record-stop-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1" /></svg>
          </button>
          <button class="secondary" id="debug">Debug retrieval</button>
          <button class="secondary" id="pipeline">Pipeline status</button>
          <span class="status" id="status">Ready</span>
        </div>
      </section>

      <section class="result" id="result">
        <div class="agent-chat-toolbar" id="agent-chat-toolbar">
          <span>Agent conversation · saved in this browser</span>
          <div class="agent-chat-controls">
            <button class="secondary" id="clear-chat">Clear chat</button>
          </div>
        </div>
        <div class="agent-chat" id="agent-chat" aria-live="polite"></div>
        <div id="pipeline-summary"></div>
        <div class="answer" id="answer"></div>
        <div class="pager" id="pager">
          <button class="secondary" id="previous">Previous</button>
          <button class="secondary" id="next">Next</button>
          <span class="status" id="page-status"></span>
        </div>
        <div class="citations" id="citations"></div>
      </section>
    </main>

    <div class="app-version" aria-label="Application version">v__APP_VERSION__</div>

    <script src="/static/app.js" defer></script>
    <script src="/static/navigation.js" defer></script>
  </body>
</html>
